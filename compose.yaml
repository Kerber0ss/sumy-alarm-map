services:
  airalarm:
    image: ghcr.io/kerber0ss/sumy-alarm-map:latest
    ports:
      - "${AIRALARM_BIND_ADDRESS:-0.0.0.0}:${AIRALARM_PORT:-8765}:8765"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

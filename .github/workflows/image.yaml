name: Test and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  AIRALARM_IMAGE: ghcr.io/kerber0ss/sumy-alarm-map

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test application
        run: |
          python3 -m unittest -v test_server.py
          node --check public/app.js
          docker compose config --quiet
      - name: Build and smoke-test container
        run: |
          docker build -t sumy-alarm-map:smoke .
          docker run -d --name airalarm-smoke --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18765:8765 sumy-alarm-map:smoke
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18765/ --output /dev/null
          test "$(docker exec airalarm-smoke id -u)" = "65532"
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base = 'http://127.0.0.1:18765'
          state = json.load(urllib.request.urlopen(base + '/api/state', timeout=30))
          assert len(state['districts']) == 5
          assert isinstance(state['targets'], list)
          for path in ['/server.py', '/analysis/Secrets/map-session-tokens.json']:
              try:
                  urllib.request.urlopen(base + path)
              except urllib.error.HTTPError as error:
                  assert error.code == 404
              else:
                  raise AssertionError('Private path is exposed: ' + path)
          PY
          docker rm -f airalarm-smoke
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.AIRALARM_IMAGE }}:latest
            ${{ env.AIRALARM_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Kerber0ss/sumy-alarm-map
            org.opencontainers.image.description=Sumy region public air alert map
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
